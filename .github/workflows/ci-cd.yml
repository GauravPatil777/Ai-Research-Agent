name: AI Research Agent CI/CD

on:
push:
branches: [main]
pull_request:
branches: [main]

permissions:
contents: read

jobs:
test:
name: Test and Build
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest

  - name: Compile Python Files
    run: |
      python -m compileall -q backend.py frontend.py mcp_client.py pdf_generator.py

  - name: Run Tests
    run: pytest -v

  - name: Build Docker Image
    run: docker build -t ai-research-agent:test .

publish:
name: Publish to Docker Hub
runs-on: ubuntu-latest
needs: test
if: github.event_name == 'push' && github.ref == 'refs/heads/main'

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build and Push Image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: |
        ${{ secrets.DOCKERHUB_USERNAME }}/ai-research-agent:latest
        ${{ secrets.DOCKERHUB_USERNAME }}/ai-research-agent:${{ github.sha }}

deploy:
name: Deploy to Render
runs-on: ubuntu-latest
needs: publish

steps:
  - name: Trigger Render Deployment
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    run: |
      IMAGE_URL="docker.io/${DOCKERHUB_USERNAME}/ai-research-agent:${GITHUB_SHA}"

      curl --fail --silent --show-error \
        --get \
        --data-urlencode "imgURL=$IMAGE_URL" \
        "$RENDER_DEPLOY_HOOK"

